services:
  db:
    image: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: senha123
      MYSQL_DATABASE: conectamais
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:rw
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin
    restart: always
    ports:
      - 8080:80
    environment:
      - PMA_HOST=db
    depends_on:
      - db

  web:
    image: nginx
    restart: always
    volumes:
      - ./meufrontend:/usr/share/nginx/html
    ports:
      - "80:80"

volumes:
  mysql_data: